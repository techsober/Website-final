# Cloudflare Pages configuration.
# Git-connected deploys also read build settings from the dashboard; this file
# documents the output dir and the optional bindings the Functions use.

name = "techsober-website"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# --- R2 bucket for protected downloads (Stripe gated delivery) ---------------
# Create the bucket, then uncomment to bind it as `DOWNLOADS` in Functions.
# Files are served only through /api/download via a signed, expiring token.
# [[r2_buckets]]
# binding = "DOWNLOADS"
# bucket_name = "techsober-downloads"

# Secrets (set in the dashboard or via `wrangler pages secret put NAME`):
#   RESEND_API_KEY, MAILERLITE_API_KEY, MAILERLITE_GROUP_ID,
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, DOWNLOAD_SIGNING_SECRET
# Public build vars (set in the dashboard build settings):
#   SITE, PUBLIC_CF_ANALYTICS_TOKEN, PUBLIC_MAILERLITE_ENABLED,
#   PUBLIC_GISCUS_*, PUBLIC_STRIPE_LINK_*
